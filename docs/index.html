<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Instagram Post Tracker</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #fafbfc;
    --fg: #13161c;
    --muted: #6b7280;
    --faint: #9aa1ac;
    --border: #e8eaee;
    --accent: #4f46e5;
    --accent-soft: #eef0fe;
    --posted: #059669;
    --posted-bg: #d3f5e8;
    --posted-ring: #10b98155;
    --missed-bg: #fdeaea;
    --missed-fg: #dc2626;
    --error: #b45309;
    --error-bg: #fdecc8;
    --pending-bg: #f1f2f4;
    --pending-fg: #b0b4bc;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .updated { color: var(--faint); font-size: 0.8rem; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
  .stat-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1.1rem;
    box-shadow: var(--shadow);
  }
  .stat-tile .value { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  .stat-tile .label { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  .extra-days-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .extra-days-toggle:hover { color: var(--fg); }
  .extra-days-toggle .toggle-box {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0.95rem;
    height: 0.95rem;
    border-radius: 3px;
    border: 1.5px solid var(--faint);
    background: transparent;
    transition: background 150ms ease, border-color 150ms ease;
  }
  .extra-days-toggle .toggle-box svg {
    width: 0.65rem;
    height: 0.65rem;
    color: #fff;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 120ms ease, transform 120ms ease;
  }
  .extra-days-toggle.expanded .toggle-box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .extra-days-toggle.expanded .toggle-box svg { opacity: 1; transform: scale(1); }
  th.extra-day, td.extra-day { display: none; }
  table.extra-days-expanded th.extra-day, table.extra-days-expanded td.extra-day { display: table-cell; }
  table { border-collapse: collapse; width: 100%; min-width: 680px; font-size: 0.85rem; }
  thead th {
    text-align: center;
    padding: 0.85rem 0.5rem 0.6rem;
    color: var(--faint);
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th .weekday { display: block; font-size: 0.62rem; opacity: 0.75; font-weight: 500; text-transform: none; margin-top: 1px; }
  th.handle-col, td.handle-col {
    text-align: left;
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 1;
  }
  tbody tr { transition: background-color 120ms ease; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:hover td.handle-col { background: var(--surface-2); }
  tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }

  td.handle-col { padding: 0.7rem 1rem; min-width: 200px; }
  .handle-name { display: flex; align-items: center; gap: 0.65rem; }
  .avatar {
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--border);
  }
  .avatar-fallback {
    width: 1.9rem;
    height: 1.9rem;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
  }
  .handle-link { color: var(--fg); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  .handle-link:hover { color: var(--accent); }
  .rate-badge {
    display: inline-flex;
    align-items: baseline;
    gap: 0.3rem;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.15rem 0.55rem;
  }
  .rate-badge b { color: var(--fg); font-size: 0.75rem; }

  td.day-col { padding: 0.5rem 0.4rem; text-align: center; }
  .cell {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.85rem;
    height: 1.85rem;
    border-radius: 8px;
    text-decoration: none;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .cell.posted { background: var(--posted-bg); color: var(--posted); box-shadow: inset 0 0 0 1px var(--posted-ring); }
  .cell.posted:hover { transform: scale(1.14); box-shadow: 0 0 0 3px var(--posted-ring); }
  .cell.missed { background: var(--missed-bg); color: var(--missed-fg); }
  .cell.missed:hover { transform: scale(1.1); }
  .cell.pending { background: var(--pending-bg); color: var(--pending-fg); }
  .cell.error {
    background: var(--error-bg);
    color: var(--error);
    font-weight: 700;
    border: none;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
  }
  .cell.error:hover { transform: scale(1.1); }
  .cell svg { width: 0.95rem; height: 0.95rem; }

  .error-popover {
    position: absolute;
    max-width: 280px;
    background: var(--fg);
    color: var(--bg);
    font-size: 0.78rem;
    line-height: 1.4;
    padding: 0.6rem 0.75rem;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(16, 24, 40, 0.18);
    z-index: 10;
    display: none;
  }
  .error-popover.visible { display: block; }

  .legend { display: flex; gap: 1.5rem; margin-top: 1.25rem; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 0.45rem; }
  .legend .swatch { width: 0.85rem; height: 0.85rem; border-radius: 5px; display: inline-block; }
  .disclaimer { margin-top: 0.6rem; font-size: 0.72rem; color: var(--faint); }

  .empty { color: var(--muted); padding: 3rem 1.5rem; text-align: center; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Instagram Post Tracker</h1>
      <span class="updated" id="updated"></span>
    </header>
    <div id="stats" class="stats"></div>
    <div id="content"></div>
    <div class="legend" id="legend" style="display:none">
      <span><i class="swatch" style="background: var(--posted-bg); box-shadow: inset 0 0 0 1px var(--posted-ring)"></i> Posted &mdash; click to view</span>
      <span><i class="swatch" style="background: var(--missed-bg)"></i> No post that day</span>
      <span><i class="swatch" style="background: var(--error-bg); box-shadow: inset 0 0 0 1px var(--error)"></i> Couldn't check &mdash; tap for reason</span>
      <span><i class="swatch" style="background: var(--pending-bg)"></i> No data yet</span>
    </div>
    <p class="disclaimer" id="disclaimer" style="display:none">
      Results may be inaccurate if someone has manually reordered their own post grid since the last check.
    </p>
  </div>
  <div class="error-popover" id="error-popover"></div>

  <script src="./cell-status.js"></script>
  <script>
    const DATA_URL = "./data/history.json";
    const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    const WARN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"></path></svg>';
    const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
    const PENDING_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12"></line></svg>';

    function fmtDayLabel(isoDate) {
      const d = new Date(isoDate + "T00:00:00");
      return {
        date: d.toLocaleDateString(undefined, { month: "short", day: "numeric" }),
        weekday: d.toLocaleDateString(undefined, { weekday: "short" }),
      };
    }

    function renderStats(handles, days, dates) {
      const container = document.getElementById("stats");
      const { rate, errorCount } = CellStatus.computeOverallStats(handles, days, dates);
      const tiles = [
        { value: handles.length, label: handles.length === 1 ? "Handle tracked" : "Handles tracked" },
        { value: `${dates.length}d`, label: "Window" },
        { value: `${rate}%`, label: "Overall posting rate" },
      ];
      if (errorCount > 0) tiles.push({ value: errorCount, label: "Failed checks" });
      container.innerHTML = tiles
        .map((t) => `<div class="stat-tile"><div class="value">${t.value}</div><div class="label">${t.label}</div></div>`)
        .join("");
    }

    async function render() {
      const updatedEl = document.getElementById("updated");
      const content = document.getElementById("content");

      let data;
      try {
        const res = await fetch(DATA_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        data = await res.json();
      } catch (err) {
        content.innerHTML = '<div class="card"><p class="empty">Couldn\'t load tracker data.<br>' + String(err) + "</p></div>";
        return;
      }

      const handles = data.handles || [];
      const days = data.days || {};
      const avatars = data.avatars || {};
      const dates = Object.keys(days).sort();

      if (handles.length === 0 || dates.length === 0) {
        content.innerHTML = '<div class="card"><p class="empty">Waiting on the first daily check to run.</p></div>';
        return;
      }

      // The primary Sep 15 + 13 days window always shows. Any earlier
      // reference days tacked on the front (e.g. Sep 13/14) are collapsed
      // by default - expandable via a "previous week" toggle rather than
      // always shown.
      const ALWAYS_VISIBLE_DAYS = 13;
      const hiddenCount = Math.max(0, dates.length - ALWAYS_VISIBLE_DAYS);
      const isExtraDay = (d, i) => i < hiddenCount;

      // A date only counts toward anyone's rate badge once it's actually
      // been reached by a check - i.e. at least one handle has a real
      // result for it (today and later never do, for any handle, by
      // design - see bucket_media_by_day). Deriving this from the data
      // itself (rather than a separately-computed "today") means the
      // badges correctly read 0/0 while the currently-visible window
      // hasn't started yet, with no floor/clamp math needed. Scoped to
      // whatever's currently visible (previous week included only when
      // expanded) - the badge reflects the same days the table shows, on
      // purpose: 0/0 by default is correct when Sep 14+ genuinely has no
      // data yet, and expanding "previous week" is how you see the real
      // numbers, not a change to what the collapsed default means.
      const reachedDates = new Set(dates.filter((d) => handles.some((h) => (days[d] || {})[h] != null)));
      const visibleReachedDates = (expanded) =>
        (expanded ? dates : dates.slice(hiddenCount)).filter((d) => reachedDates.has(d));

      function updateRateBadges(expanded) {
        const relevant = visibleReachedDates(expanded);
        for (const handle of handles) {
          const { postedCount, checkedCount } = CellStatus.computeHandleStats(days, relevant, handle);
          const badge = table.querySelector(`.rate-badge[data-handle="${CSS.escape(handle)}"]`);
          if (!badge) continue;
          badge.querySelector(".posted-count").textContent = postedCount;
          badge.querySelector(".checked-count").textContent = checkedCount;
        }
      }

      updatedEl.textContent = data.updated_at ? `Updated ${new Date(data.updated_at).toLocaleString()}` : "";
      renderStats(handles, days, dates);
      document.getElementById("legend").style.display = "flex";
      document.getElementById("disclaimer").style.display = "block";

      const table = document.createElement("table");

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      let headHtml = '<th class="handle-col">Handle</th>';
      dates.forEach((d, i) => {
        const { date, weekday } = fmtDayLabel(d);
        const cls = isExtraDay(d, i) ? ' class="extra-day"' : "";
        headHtml += `<th${cls}>${date}<span class="weekday">${weekday}</span></th>`;
      });
      headRow.innerHTML = headHtml;
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (const handle of handles) {
        const row = document.createElement("tr");

        const avatarFile = avatars[handle];
        const initial = handle.charAt(0);
        const avatarHtml = avatarFile
          ? `<img class="avatar" src="./data/avatars/${avatarFile}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;avatar-fallback&quot;>${initial}</span>'">`
          : `<span class="avatar-fallback">${initial}</span>`;

        const handleCell = document.createElement("td");
        handleCell.className = "handle-col";
        handleCell.innerHTML = `
          <div class="handle-name">
            ${avatarHtml}
            <a class="handle-link" href="https://instagram.com/${handle}" target="_blank" rel="noopener">@${handle}</a>
            <span class="rate-badge" data-handle="${handle}"><b class="posted-count">0</b>/<span class="checked-count">0</span></span>
          </div>`;
        row.appendChild(handleCell);

        dates.forEach((d, i) => {
          const result = (days[d] || {})[handle];
          const td = document.createElement("td");
          td.className = isExtraDay(d, i) ? "day-col extra-day" : "day-col";

          const status = CellStatus.classifyCell(result);
          if (status.cls === "pending") {
            td.innerHTML = `<span class="cell pending" title="No data yet for ${d}">${PENDING_ICON}</span>`;
          } else if (status.cls === "error") {
            const msg = status.message.replace(/"/g, "&quot;");
            td.innerHTML = `<button type="button" class="cell error" data-msg="${msg}">${WARN_ICON}</button>`;
          } else if (status.cls === "posted") {
            const href = status.permalink || `https://instagram.com/${handle}`;
            td.innerHTML = `<a class="cell posted" href="${href}" target="_blank" rel="noopener" title="Posted ${d}">${CHECK_ICON}</a>`;
          } else {
            td.innerHTML = `<span class="cell missed" title="No post on ${d}">${X_ICON}</span>`;
          }
          row.appendChild(td);
        });
        tbody.appendChild(row);
      }
      table.appendChild(tbody);
      updateRateBadges(false);

      content.innerHTML = "";
      const card = document.createElement("div");
      card.className = "card";

      if (hiddenCount > 0) {
        const toggle = document.createElement("div");
        toggle.className = "extra-days-toggle";
        const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        const label = "previous week";
        toggle.innerHTML = `<span class="toggle-box">${checkSvg}</span><span class="toggle-label">Show ${label}</span>`;
        toggle.addEventListener("click", () => {
          const expanded = table.classList.toggle("extra-days-expanded");
          toggle.classList.toggle("expanded", expanded);
          toggle.querySelector(".toggle-label").textContent = expanded ? `Hide ${label}` : `Show ${label}`;
          updateRateBadges(expanded);
        });
        card.appendChild(toggle);
      }

      const scrollWrap = document.createElement("div");
      scrollWrap.className = "table-scroll";
      scrollWrap.appendChild(table);
      card.appendChild(scrollWrap);
      content.appendChild(card);
    }

    function setupErrorPopover() {
      const popover = document.getElementById("error-popover");

      document.addEventListener("click", (e) => {
        const btn = e.target.closest(".cell.error");
        if (!btn) {
          popover.classList.remove("visible");
          return;
        }
        e.stopPropagation();
        const wasShownForThisButton = popover.classList.contains("visible") && popover._forButton === btn;
        popover.classList.remove("visible");
        if (wasShownForThisButton) return;

        popover.textContent = btn.getAttribute("data-msg") || "unknown error";
        popover._forButton = btn;

        const rect = btn.getBoundingClientRect();
        popover.classList.add("visible");
        const popRect = popover.getBoundingClientRect();
        let left = rect.left + window.scrollX + rect.width / 2 - popRect.width / 2;
        left = Math.max(8, Math.min(left, window.scrollX + document.documentElement.clientWidth - popRect.width - 8));
        popover.style.left = `${left}px`;
        popover.style.top = `${rect.bottom + window.scrollY + 8}px`;
      });
    }

    setupErrorPopover();
    render();
  </script>
</body>
</html>
