name: Diagnose rendering

# Manual, throwaway diagnostic - does NOT touch data/tracker.db or
# docs/data/history.json. See scripts/diagnose_rendering.py for what
# question this is answering and why.
on:
  workflow_dispatch:
    inputs:
      handle:
        description: "Handle to test (should be a currently-healthy one)"
        required: false
        default: "torch_boy"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright's Chromium browser
        run: python3 -m playwright install --with-deps chromium

      # Same cache restore as daily-check.yml, read-only here (no save
      # step) - this diagnostic needs the real persisted session to be a
      # fair test, not a fresh cookie-less context that's likely to get
      # redirected to a login wall on its own.
      - name: Restore tracker DB cache
        uses: actions/cache/restore@v4
        with:
          path: data/tracker.db
          key: tracker-db-nonexistent-key-forces-restore-keys-match
          restore-keys: |
            tracker-db-

      - name: Run diagnostic
        run: python3 scripts/diagnose_rendering.py "${{ inputs.handle }}"
