name: Daily Instagram post check

# GitHub Actions cron is UTC-only and does not shift for daylight saving,
# so we fire twice a day (covering both PST and PDT) targeting roughly
# 00:30 America/Los_Angeles:
#   00:30 PST (UTC-8, ~Nov-Mar) = 08:30 UTC
#   00:30 PDT (UTC-7, ~Mar-Nov) = 07:30 UTC
#
# GitHub's own scheduler is best-effort and can run cron jobs late -
# minutes to hours late is normal, and both firings landed 30-95 minutes
# late the first two times this actually ran (see git history for the
# guard rewrite this replaced, which used a tight time-of-day tolerance
# window and as a result never once let a run through). The guard below
# no longer cares what time it is - it only checks whether today's local
# date already has a successful run (via docs/data/history.json's
# updated_at), so a late firing still runs, and the second of the two
# daily cron firings harmlessly no-ops once the first one succeeds.
#
# workflow_dispatch (manual runs from the Actions tab) always runs,
# regardless of the guard - a human explicitly asking for a run should
# never get silently skipped.
on:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard - skip only if today's local date already ran successfully
        id: guard
        env:
          TZ_NAME: ${{ vars.TRACKER_TIMEZONE || 'America/Los_Angeles' }}
        run: |
          SHOULD_RUN=$(python3 scripts/ci_guard.py "${{ github.event_name }}")
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright's Chromium browser
        if: steps.guard.outputs.should_run == 'true'
        run: python3 -m playwright install --with-deps chromium

      # data/tracker.db (post history + the persisted browser session) is
      # never committed - it holds Instagram session cookies alongside the
      # data, and this repo is public. It's persisted purely as a CI cache
      # across runs instead. Restore uses a prefix match to pick up the
      # most recent save; save always writes under a new run-specific key
      # since a given cache key is immutable once created. Stale entries
      # age out automatically (GitHub evicts caches unused for 7+ days).
      - name: Restore tracker DB cache
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/tracker.db
          key: tracker-db-${{ github.run_id }}
          restore-keys: |
            tracker-db-

      - name: Check handles
        if: steps.guard.outputs.should_run == 'true'
        env:
          TRACKER_TIMEZONE: ${{ vars.TRACKER_TIMEZONE || 'America/Los_Angeles' }}
          # Daily runs only need to catch yesterday's post, which the most
          # recent page (~12 posts) almost always covers - deeper
          # pagination is for backfills/manual runs (see MAX_FEED_PAGES in
          # scripts/check_posts.py). Override with a repo variable if a
          # tracked account posts frequently enough that 1 page risks
          # missing yesterday's post.
          MAX_FEED_PAGES: ${{ vars.MAX_FEED_PAGES || '1' }}
          # Empty by default (normal rolling 14-day-ending-yesterday window).
          # Set to an ISO date via the repo variable to pin the tracked
          # window to a fixed start instead - see WINDOW_START_DATE in
          # scripts/check_posts.py's module docstring. Needs to stay set as
          # a repo variable (not just passed once locally) for as long as
          # you want the fixed window to persist, since every scheduled run
          # reads it fresh - unset it to go back to the normal rolling window.
          WINDOW_START_DATE: ${{ vars.WINDOW_START_DATE }}
        run: python3 scripts/check_posts.py

      - name: Save tracker DB cache
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/tracker.db
          key: tracker-db-${{ github.run_id }}

      - name: Commit updated history
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "ig-post-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/history.json docs/data/avatars
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Update post history"
          # A plain `git push` can lose a whole run's real check results to
          # a bare "rejected: fetch first" if anything else pushed to main
          # while this run was checking handles (confirmed in production -
          # a manual push during an in-flight run dropped its results
          # entirely, with no retry). On rejection, re-apply our freshly-
          # generated files on top of whatever main now is, rather than a
          # line-level rebase - history.json is always fully regenerated
          # from the DB, never hand-edited, so there's nothing to merge
          # line-by-line; "ours, replayed on the new tip" is exactly the
          # right semantics here.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) - replaying our commit on top of the new main"
            git fetch origin main
            git reset --soft origin/main
            git add docs/data/history.json docs/data/avatars
            git commit -m "Update post history"
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
