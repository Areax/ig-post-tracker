name: Daily Instagram post check

# GitHub Actions cron is UTC-only and does not shift for daylight saving,
# so we fire twice a day (covering both PST and PDT) targeting roughly
# 00:30 America/Los_Angeles:
#   00:30 PST (UTC-8, ~Nov-Mar) = 08:30 UTC
#   00:30 PDT (UTC-7, ~Mar-Nov) = 07:30 UTC
#
# GitHub's own scheduler is best-effort and can run cron jobs late -
# minutes to hours late is normal, and both firings landed 30-95 minutes
# late the first two times this actually ran (see git history for the
# guard rewrite this replaced, which used a tight time-of-day tolerance
# window and as a result never once let a run through). The guard below
# no longer cares what time it is - it only checks whether today's local
# date already has a successful run (via docs/data/history.json's
# updated_at), so a late firing still runs, and the second of the two
# daily cron firings harmlessly no-ops once the first one succeeds.
#
# workflow_dispatch (manual runs from the Actions tab) always runs,
# regardless of the guard - a human explicitly asking for a run should
# never get silently skipped.
on:
  schedule:
    - cron: "30 8 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard - skip only if today's local date already ran successfully
        id: guard
        env:
          TZ_NAME: ${{ vars.TRACKER_TIMEZONE || 'America/Los_Angeles' }}
        run: |
          SHOULD_RUN=$(python3 scripts/ci_guard.py "${{ github.event_name }}")
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Install Playwright's Chromium browser
        if: steps.guard.outputs.should_run == 'true'
        run: python3 -m playwright install --with-deps chromium

      # data/tracker.db (post history + the persisted browser session) is
      # never committed - it holds Instagram session cookies alongside the
      # data, and this repo is public. It's persisted purely as a CI cache
      # across runs instead. Restore uses a prefix match to pick up the
      # most recent save; save always writes under a new run-specific key
      # since a given cache key is immutable once created. Stale entries
      # age out automatically (GitHub evicts caches unused for 7+ days).
      - name: Restore tracker DB cache
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/tracker.db
          key: tracker-db-${{ github.run_id }}
          restore-keys: |
            tracker-db-

      - name: Check handles
        if: steps.guard.outputs.should_run == 'true'
        env:
          TRACKER_TIMEZONE: ${{ vars.TRACKER_TIMEZONE || 'America/Los_Angeles' }}
          # Daily runs only need to catch yesterday's post, which the most
          # recent page (~12 posts) almost always covers - deeper
          # pagination is for backfills/manual runs (see MAX_FEED_PAGES in
          # scripts/check_posts.py). Override with a repo variable if a
          # tracked account posts frequently enough that 1 page risks
          # missing yesterday's post.
          MAX_FEED_PAGES: ${{ vars.MAX_FEED_PAGES || '1' }}
          # Empty by default (normal rolling 14-day-ending-yesterday window).
          # Set to an ISO date via the repo variable to pin the tracked
          # window to a fixed start instead - see WINDOW_START_DATE in
          # scripts/check_posts.py's module docstring. Needs to stay set as
          # a repo variable (not just passed once locally) for as long as
          # you want the fixed window to persist, since every scheduled run
          # reads it fresh - unset it to go back to the normal rolling window.
          WINDOW_START_DATE: ${{ vars.WINDOW_START_DATE }}
          # How many days the pinned window above spans - only meaningful
          # together with WINDOW_START_DATE. Was NOT wired here until
          # 2026-09-14 - setting only WINDOW_START_DATE silently fell back
          # to this script default (14) regardless of intent, which is why
          # the site's "Sep 14 + 2 weeks always visible, previous week
          # toggle" design broke when the window got repinned without this.
          HISTORY_DAYS: ${{ vars.HISTORY_DAYS || '14' }}
          # Unset by default - direct connection, unchanged. Set all three
          # repo secrets (Settings > Secrets and variables > Actions) to
          # route through a residential proxy instead, once one is set up -
          # see PROXY_SERVER's comment in scripts/check_posts.py for why
          # GitHub's own shared runner IP needs this (confirmed blocked by
          # Instagram, 2026-09-13).
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          # Only meaningful when the proxy above is configured - how many
          # requests to make through one IPRoyal session (one exit IP)
          # before rotating to a fresh one. Defaults to 5 in the script
          # itself if unset here - see PROXY_ROTATE_EVERY's comment in
          # scripts/check_posts.py for why one sticky IP for the whole
          # run turned out to be the wrong call.
          PROXY_ROTATE_EVERY: ${{ vars.PROXY_ROTATE_EVERY || '5' }}
          # Unset by default - fully anonymous, unchanged. Set this repo
          # secret to a real logged-in account's Playwright storage_state
          # (JSON) to unlock pagination past each account's ~12 most
          # recent posts on MAX_FEED_PAGES > 1 backfills - see
          # IG_SESSION_STATE_JSON's comment in scripts/check_posts.py for
          # what this is, why anonymous access can't do this at all
          # (confirmed three independent ways, 2026-09-14), and how to
          # produce one.
          IG_SESSION_STATE_JSON: ${{ secrets.IG_SESSION_STATE_JSON }}
        run: python3 scripts/check_posts.py

      - name: Save tracker DB cache
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/tracker.db
          key: tracker-db-${{ github.run_id }}

      - name: Commit updated history
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "ig-post-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/history.json docs/data/avatars
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Update post history"
          # A plain `git push` can lose a whole run's real check results to
          # a bare "rejected: fetch first" if anything else pushed to main
          # while this run was checking handles (confirmed in production -
          # a manual push during an in-flight run dropped its results
          # entirely, with no retry).
          #
          # On rejection, replay our freshly-generated files on top of
          # whatever main now is - via a HARD reset, not soft. This
          # checkout happened once, at the start of a run that then spent
          # ~10 minutes checking handles; if anything else landed on main
          # during that window, this run's working tree is stale for
          # every file, not just history.json/avatars. A soft reset only
          # moves HEAD and leaves the index/working tree untouched, so
          # re-adding just the 2 generated paths still commits whatever
          # STALE content every other tracked file already had sitting in
          # the index - which silently reverted real code changes
          # (scripts/check_posts.py, scripts/db.py) back to an old version
          # in production, with no hint in the commit's own diff that
          # anything was wrong, since git only diffs against the parent it
          # picked, not against "whatever main actually was by push time."
          # A hard reset brings every file back in sync with the real
          # current main first; only then do we restore our own generated
          # output on top and commit just that.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5) - replaying our generated files on top of the new main"
            mkdir -p /tmp/history-replay
            cp docs/data/history.json /tmp/history-replay/history.json
            rm -rf /tmp/history-replay/avatars
            cp -r docs/data/avatars /tmp/history-replay/avatars
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/history-replay/history.json docs/data/history.json
            mkdir -p docs/data/avatars
            cp -r /tmp/history-replay/avatars/. docs/data/avatars/
            git add docs/data/history.json docs/data/avatars
            git commit -m "Update post history"
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
